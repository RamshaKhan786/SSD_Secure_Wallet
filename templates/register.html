{% extends "base.html" %}
{% block title %}Create account · Mini Wallet{% endblock %}
{% block content %}
<div class="center card">
  <h1>Create account
    <span class="badge {{ 'b-sec' if secure else 'b-vul' }}">{{ 'SECURE MODE' if secure else 'VULNERABLE MODE' }}</span>
  </h1>
  <form method="post">
    <input name="username" placeholder="Username (a-z, 0-9, _)" autocomplete="off">
    <input name="full_name" placeholder="Full name">
    <input type="email" name="email" placeholder="Email" required>
    <input type="text" name="cnic" placeholder="CNIC (12345-1234567-1)" required>
    <input name="password" id="pw" type="password" placeholder="Password (min 8)">
    <div style="height:6px;background:#334155;border-radius:4px">
      <div id="fill" style="height:6px;width:0;border-radius:4px;transition:.3s"></div>
    </div>
    <div class="mut" id="lbl">&nbsp;</div>
    <button style="width:100%;margin-top:8px">Create account</button>
  </form>
  <p class="mut">Have an account? <a href="/login">Log in</a></p>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/register.js') }}"></script>
{% endblock %}
